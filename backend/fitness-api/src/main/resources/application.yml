spring:
  application:
    name: fitness-api

  datasource:
    url: jdbc:postgresql://localhost:5432/fitness_db
    username: fitness_user
    password: fitness_password

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        '[format_sql]': true

  flyway:
    enabled: true

server:
  port: 8080