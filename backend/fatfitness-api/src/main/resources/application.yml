spring:
  application:
    name: fatfitness-api

  datasource:
    url: jdbc:postgresql://localhost:5432/fitness_db
    username: fitness_user
    password: fitness_password

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        '[format_sql]': true

  flyway:
    enabled: true

server:
  port: 8080

fatfitness:
  auth:
    jwt:
      issuer: fatfitness-api
      secret: ${FATFITNESS_JWT_SECRET:dev-only-change-me-secret-keep-at-least-32-characters}
      access-token-ttl: PT15M
    refresh-token-ttl: P30D
    refresh-cookie:
      name: fatfitness_refresh_token
      path: /api/auth
      secure: false
      same-site: Lax
    owner-seed:
      email: ${FATFITNESS_OWNER_EMAIL:}
      display-name: ${FATFITNESS_OWNER_DISPLAY_NAME:}
      country-region-code: ${FATFITNESS_OWNER_COUNTRY_REGION_CODE:}
      password: ${FATFITNESS_OWNER_PASSWORD:}
