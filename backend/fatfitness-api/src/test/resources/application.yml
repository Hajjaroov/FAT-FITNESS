spring:
  application:
    name: fatfitness-api

  datasource:
    url: jdbc:h2:mem:fitness_api_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

fatfitness:
  auth:
    jwt:
      issuer: fatfitness-api-test
      secret: test-only-change-me-secret-keep-at-least-32-characters
      access-token-ttl: PT15M
    refresh-token-ttl: P30D
    rate-limit:
      enabled: false
    refresh-cookie:
      name: fatfitness_refresh_token
      path: /api/auth
      secure: false
      same-site: Lax
  push:
    vapid-public-key: BBZNDVytMAjkvm3Ai8rgdxE-4I7Qr9P0JGgP4IEBHgX8KCQcmAG1Q8RN7Co1NsZtoePc3-UfRewWuB7f3Iw_8X8
    vapid-private-key: eT2OZp3fgzq38wr8fubzFveDJq3asRRZ_2GdI4qJKag
    vapid-subject: mailto:test@example.com
