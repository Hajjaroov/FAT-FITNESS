spring:
  application:
    name: fatfitness-api

  datasource:
    url: jdbc:h2:mem:fitness_api_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

fatfitness:
  auth:
    jwt:
      issuer: fatfitness-api-test
      secret: test-only-change-me-secret-keep-at-least-32-characters
      access-token-ttl: PT15M
    refresh-token-ttl: P30D
    refresh-cookie:
      name: fatfitness_refresh_token
      path: /api/auth
      secure: false
      same-site: Lax
