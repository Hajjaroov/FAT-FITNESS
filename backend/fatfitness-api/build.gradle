plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.fatfitness'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springframework.security:spring-security-oauth2-jose'
	implementation 'org.springframework.security:spring-security-oauth2-resource-server'
	implementation 'nl.martijndwars:web-push:5.1.2'
	// bcprov is an <optional> dependency in web-push's POM, so it is not pulled
	// in transitively — declared explicitly (newer jdk18on artifact; same
	// org.bouncycastle classes web-push expects).
	implementation 'org.bouncycastle:bcprov-jdk18on:1.85'
	// web-push declares httpasyncclient (which brings httpcore, exposing the
	// org.apache.http.HttpResponse type PushService.send() returns) and jose4j
	// (its checked JoseException, part of send()'s throws clause) as Maven
	// runtime-scope dependencies, so Gradle does not put them on the compile
	// classpath — declared explicitly since WebPushSender calls send() directly.
	implementation 'org.apache.httpcomponents:httpcore:4.4.16'
	implementation 'org.bitbucket.b_c:jose4j:0.7.9'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('bootRun') {
	def localEnvFile = file('.env')

	if (localEnvFile.exists()) {
		localEnvFile.readLines()
				.collect { it.trim() }
				.findAll { it && !it.startsWith('#') && it.contains('=') }
				.each { line ->
					def separatorIndex = line.indexOf('=')
					def key = line.substring(0, separatorIndex).trim()
					def value = line.substring(separatorIndex + 1).trim()

					if ((value.startsWith('"') && value.endsWith('"'))
							|| (value.startsWith("'") && value.endsWith("'"))) {
						value = value.substring(1, value.length() - 1)
					}

					if (key) {
						environment key, value
					}
				}
	}
}
