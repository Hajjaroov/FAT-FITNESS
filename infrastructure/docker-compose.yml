name: fatfitness

services:
  postgres:
    image: postgres:18
    container_name: fitness_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fitness_db
      POSTGRES_USER: ${FATFITNESS_DB_USERNAME:?Set FATFITNESS_DB_USERNAME in infrastructure/.env}
      POSTGRES_PASSWORD: ${FATFITNESS_DB_PASSWORD:?Set FATFITNESS_DB_PASSWORD in infrastructure/.env}
    ports:
      - "5432:5432"
    volumes:
      - fitness_postgres_data_pg18:/var/lib/postgresql
    command: >
      postgres
        -c log_min_duration_statement=500
        -c log_statement=ddl
        -c log_connections=on
        -c log_disconnections=on

volumes:
  fitness_postgres_data_pg18:
    external: true
    name: infrastructure_fitness_postgres_data_pg18
