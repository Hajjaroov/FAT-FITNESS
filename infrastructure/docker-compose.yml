services:
  postgres:
    image: postgres:18
    container_name: fitness_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fitness_db
      POSTGRES_USER: fitness_user
      POSTGRES_PASSWORD: fitness_password
    ports:
      - "5432:5432"
    volumes:
      - fitness_postgres_data_pg18:/var/lib/postgresql

volumes:
  fitness_postgres_data_pg18:
